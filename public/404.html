<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ColeDance</title>
    <script>
      // Single Page App redirect for GitHub Pages hosting
      // Converts deep paths into query parameters so index.html can route cleanly
      var pathSegmentsToKeep = 1; // repository root e.g. /ColeDance/
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? (subPath ? '&' : '') + l.search.slice(1) : '';
      var redirectUrl = l.protocol + '//' + l.host + repoBase + '/?' + (subPath ? 'route=' + encodeURIComponent(subPath) : '') + query + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #0b051b; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to ColeDance...</p>
  </body>
</html>
